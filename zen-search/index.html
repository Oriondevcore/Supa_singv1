<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SupaTraxx — Song Search & Request</title>
  <meta name="theme-color" content="#050505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SupaSing">
  <meta name="description" content="Find your next karaoke song fast.">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/SS-LOGO.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="top-bar">
    <img src="/SS-LOGO.svg" alt="SupaSing" class="logo-glow" width="36" height="36">
    <button class="singer-badge" id="singerBadge" aria-label="Singer profile"></button>
  </header>

  <main>
    <section class="hero">
      <h1 class="tagline">What are you singing?</h1>
    </section>

    <section class="search-section">
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search song or artist..." autocomplete="off">
      </div>
    </section>

    <section class="mood-section" id="moodSection">
      <h2 class="section-title">How do you feel?</h2>
      <div class="mood-grid" id="moodGrid"></div>
    </section>

    <section class="genres-section" id="genresSection">
      <p class="section-label">or pick a genre</p>
      <div class="chip-scroll" id="genreChips"></div>
    </section>

    <div id="results"></div>

    <footer class="page-footer">
      <p class="footer-text">Pick a song and sing.</p>
      <div class="footer-links">
        <a href="https://fav.oriondevcore.com" class="footer-link">My Favourites</a>
        <a href="https://userdb.oriondevcore.com" class="footer-link">My Profile</a>
      </div>
    </footer>
  </main>

  <div class="modal-overlay" id="regModal">
    <div class="modal">
      <div class="modal-header">
        <h2>Let's Go!</h2>
        <p class="modal-sub">Tell us your name to get singing.</p>
      </div>
      <form id="regForm">
        <div class="field">
          <label for="regName">Stage Name</label>
          <input type="text" id="regName" placeholder="e.g. Starwalker" required autocomplete="off">
        </div>
        <div class="field">
          <label for="regWhatsApp">WhatsApp Number</label>
          <input type="tel" id="regWhatsApp" placeholder="e.g. +27 72 123 4567" required autocomplete="tel">
        </div>
        <button type="submit" id="regSubmit" class="modal-btn">Let's Go!</button>
        <button type="button" id="regCancel" class="modal-btn modal-btn-secondary">Maybe Later</button>
      </form>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
